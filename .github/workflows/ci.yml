name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Zig 0.16.0
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64)
              platform=x86_64-linux
              checksum=70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00 ;;
            Darwin-arm64)
              platform=aarch64-macos
              checksum=b23d70deaa879b5c2d486ed3316f7eaa53e84acf6fc9cc747de152450d401489 ;;
            Darwin-x86_64)
              platform=x86_64-macos
              checksum=0387557ed1877bc6a2e1802c8391953baddba76081876301c522f52977b52ba7 ;;
            *) exit 1 ;;
          esac
          archive="zig-${platform}-0.16.0.tar.xz"
          curl --fail --location --retry 3 "https://ziglang.org/download/0.16.0/${archive}" -o "$RUNNER_TEMP/zig.tar.xz"
          printf '%s  %s\n' "$checksum" "$RUNNER_TEMP/zig.tar.xz" | shasum -a 256 --check
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-${platform}-0.16.0" >> "$GITHUB_PATH"
      - name: Fetch pinned build dependencies
        run: zig build --fetch
      - name: Format
        run: zig fmt --check src/
      - name: Offline tests
        run: zig build test --system zig-pkg --summary all
      - name: Build
        run: zig build --system zig-pkg
      - name: Scripted mission and MCP integration
        run: ./test/e2e/m45/run.sh
      - name: WebSocket admission and delivery lifecycle
        run: node test/e2e/ws/admission.mjs
      - name: Real filter integration
        run: ./test/probe/filter/run.sh && ./test/e2e/m8/run.sh
