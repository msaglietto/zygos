name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read
  actions: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # zig_checksum is the SHA-256 of the official 0.16.0 tarball for
          # that platform. It is part of the toolchain cache key, so a
          # rotated pin cannot reuse the previous archive.
          - os: ubuntu-24.04
            zig_platform: x86_64-linux
            zig_checksum: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
          - os: macos-14
            zig_platform: aarch64-macos
            zig_checksum: b23d70deaa879b5c2d486ed3316f7eaa53e84acf6fc9cc747de152450d401489
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      # Package tarballs only. zig build --fetch reads p/<hash>.tar.gz from
      # here and unpacks zig-pkg/; --system zig-pkg then refuses the network.
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-global-cache
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # The filter probe runs `git log -20` and `git diff HEAD~1`.
          # actions/checkout's default depth is 1, so HEAD~1 is not a
          # revision and the probe would score git's fatal text.
          fetch-depth: 0
      - name: Cache Zig 0.16.0 toolchain
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/zig-toolchain
          key: zig-toolchain-0.16.0-${{ runner.os }}-${{ runner.arch }}-${{ matrix.zig_checksum }}
      - name: Cache fetched build dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/.zig-global-cache/p
          # build.zig.zon carries the dependency hashes. A zon change misses
          # this key; restore-keys may still hand back an older tarball set,
          # and zig build --fetch checks every hash before using it.
          key: zig-packages-0.16.0-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.zig.zon') }}
          restore-keys: |
            zig-packages-0.16.0-${{ runner.os }}-${{ runner.arch }}-
      - name: Install Zig 0.16.0
        shell: bash
        env:
          ZIG_PLATFORM: ${{ matrix.zig_platform }}
          ZIG_CHECKSUM: ${{ matrix.zig_checksum }}
        run: |
          set -euo pipefail
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64) actual=x86_64-linux ;;
            Darwin-arm64) actual=aarch64-macos ;;
            Darwin-x86_64) actual=x86_64-macos ;;
            *) echo "unsupported runner $(uname -s)-$(uname -m)" >&2; exit 1 ;;
          esac
          if [[ "$actual" != "$ZIG_PLATFORM" ]]; then
            echo "runner platform $actual does not match matrix $ZIG_PLATFORM" >&2
            exit 1
          fi
          cache_dir="$RUNNER_TEMP/zig-toolchain"
          work_dir="$RUNNER_TEMP/zig-work"
          name="zig-${ZIG_PLATFORM}-0.16.0"
          archive="$cache_dir/${name}.tar.xz"
          mkdir -p "$cache_dir"
          verify() { printf '%s  %s\n' "$ZIG_CHECKSUM" "$archive" | shasum -a 256 --check; }
          # A cache hit still has to match the pinned checksum. A mismatch
          # deletes the restored archive and downloads once; a bad download
          # fails the job.
          if [[ -f "$archive" ]] && ! verify; then
            rm -f "$archive"
          fi
          if [[ ! -f "$archive" ]]; then
            curl --fail --location --retry 3 \
              "https://ziglang.org/download/0.16.0/${name}.tar.xz" \
              -o "$archive"
            verify
          fi
          rm -rf "$work_dir"
          mkdir -p "$work_dir"
          tar -xJf "$archive" -C "$work_dir"
          echo "$work_dir/$name" >> "$GITHUB_PATH"
      - name: Fetch pinned build dependencies
        run: zig build --fetch
      - name: Format
        run: zig fmt --check build.zig src/ test/
      - name: Offline tests
        run: zig build test --system zig-pkg --summary all
      - name: Build
        run: zig build --system zig-pkg
      - name: Scripted mission and MCP integration
        run: ./test/e2e/m45/run.sh
      - name: WebSocket admission and delivery lifecycle
        run: node test/e2e/ws/admission.mjs
      - name: Real filter integration
        run: ./test/probe/filter/run.sh && ./test/e2e/m8/run.sh
